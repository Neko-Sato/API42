[project]
name = "api42"
version = "0.1.0"
description = "42 API client library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "authlib>=1.7.2",
  "beautifulsoup4>=4.14.3",
  "httpx>=0.28.1",
  "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
